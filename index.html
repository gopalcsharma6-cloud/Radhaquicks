<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RadhaQuicks</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#ff6500;color:#fff;padding:16px;position:sticky;top:0;z-index:10}
h1{margin:0;font-size:26px}
header p{margin:5px 0 12px}
.search{width:100%;padding:13px;border:0;border-radius:10px;font-size:16px}
nav{display:flex;gap:8px;overflow:auto;background:#fff;padding:10px}
nav button{padding:9px 14px;border:1px solid #ddd;border-radius:20px;background:#fff;white-space:nowrap}
#products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:14px;padding:10px;box-shadow:0 2px 8px #ddd}
.photo{height:110px;background:#fff0e5;border-radius:10px;display:grid;place-items:center;font-size:52px}
.name{font-weight:bold;margin-top:9px}
.size{color:#666;margin-top:4px}
.price{font-size:19px;font-weight:bold;margin:7px 0}
.add{width:100%;padding:10px;border:0;border-radius:8px;background:#ff6500;color:#fff;font-weight:bold}
.cart{position:fixed;bottom:12px;left:12px;right:12px;background:#111;color:#fff;padding:15px;border-radius:13px;text-align:center;font-weight:bold;z-index:20}
#cartbox{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;padding:18px;border-radius:20px 20px 0 0;box-shadow:0 -3px 15px #aaa;z-index:30;max-height:85vh;overflow:auto}
input,textarea{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:8px}
.close{padding:8px;border:0;border-radius:8px}
.order{width:100%;padding:13px;background:#16a34a;color:#fff;border:0;border-radius:8px;font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🛒 RadhaQuicks</h1>
<p>Radhakund • Govardhan | Fast Local Delivery</p>
<input class="search" id="search" placeholder="🔍 Search products" oninput="showProducts()">
</header>

<nav>
<button onclick="setCat('All')">All</button>
<button onclick="setCat('Water')">💧 Water</button>
<button onclick="setCat('Dairy')">🥛 Dairy</button>
<button onclick="setCat('Cold Drinks')">🥤 Cold Drinks</button>
<button onclick="setCat('Frooti')">🧃 Frooti</button>
</nav>

<div id="products"></div>

<div class="cart" onclick="openCart()">
🛒 Cart: <span id="count">0</span> items | ₹<span id="total">0</span>
</div>

<div id="cartbox">
<button class="close" onclick="closeCart()">✕ Close</button>
<h2>🛒 Your Cart</h2>
<div id="cartitems"></div>

<h3>Delivery Details</h3>
<input id="customerName" placeholder="आपका नाम">
<input id="mobile" placeholder="Mobile Number">
<textarea id="address" rows="3" placeholder="पूरा Delivery Address"></textarea>

<button class="order" onclick="placeOrder()">Place Order - COD</button>
</div>

<script>
const products=[

["Bisleri","500ml",10,"Water","💧"],
["Bisleri","1L",20,"Water","💧"],
["Bisleri","2L",30,"Water","💧"],
["Bisleri","5L",80,"Water","💧"],

["Ananda Milk","500ml",35,"Dairy","🥛"],
["Amul Milk","500ml",36,"Dairy","🥛"],
["Ananda Curd","100g",20,"Dairy","🥣"],
["Ananda Curd","400ml",35,"Dairy","🥣"],

["Coca-Cola","250ml",20,"Cold Drinks","🥤"],
["Sprite","250ml",20,"Cold Drinks","🥤"],
["Limca","250ml",20,"Cold Drinks","🥤"],
["Thums Up","250ml",20,"Cold Drinks","🥤"],
["Fanta","250ml",20,"Cold Drinks","🥤"],
["Maaza","250ml",20,"Cold Drinks","🥭"],

["Sprite","750ml",40,"Cold Drinks","🥤"],
["Coca-Cola","750ml",40,"Cold Drinks","🥤"],
["Limca","750ml",40,"Cold Drinks","🥤"],
["Thums Up","750ml",40,"Cold Drinks","🥤"],
["Fanta","750ml",40,"Cold Drinks","🥤"],

["Sprite","1L",50,"Cold Drinks","🥤"],
["Coca-Cola","1L",50,"Cold Drinks","🥤"],
["Limca","1L",50,"Cold Drinks","🥤"],
["Thums Up","1L",50,"Cold Drinks","🥤"],
["Fanta","1L",50,"Cold Drinks","🥤"],

["Sprite","2L",90,"Cold Drinks","🥤"],
["Coca-Cola","2L",90,"Cold Drinks","🥤"],
["Limca","2L",90,"Cold Drinks","🥤"],
["Thums Up","2L",90,"Cold Drinks","🥤"],
["Fanta","2L",90,"Cold Drinks","🥤"],

["Pepsi","750ml",40,"Cold Drinks","🥤"],
["Pepsi","1.25L",50,"Cold Drinks","🥤"],
["Pepsi","2L",90,"Cold Drinks","🥤"],

["Frooti","330ml",20,"Frooti","🧃"],
["Frooti","750ml",40,"Frooti","🧃"],
["Frooti","1L",60,"Frooti","🧃"],
["Frooti","2L",100,"Frooti","🧃"]

];

let cart=[];
let category="All";

function setCat(c){
category=c;
showProducts();
}

function showProducts(){
let search=document.getElementById("search").value.toLowerCase();
let html="";

products.forEach((p,i)=>{
if((category=="All"||p[3]==category) &&
(p[0]+" "+p[1]).toLowerCase().includes(search)){

html+=`
<div class="card">
<div class="photo">${p[4]}</div>
<div class="name">${p[0]}</div>
<div class="size">${p[1]}</div>
<div class="price">₹${p[2]}</div>
<button class="add" onclick="addToCart(${i})">+ Add</button>
</div>`;
}
});

document.getElementById("products").innerHTML=html;
}

function addToCart(i){
cart.push(i);
updateCart();
}

function updateCart(){
let total=0;
cart.forEach(i=>total+=products[i][2]);
document.getElementById("count").innerText=cart.length;
document.getElementById("total").innerText=total;
}

function openCart(){
let html="";
let total=0;

cart.forEach((i,n)=>{
html+=`
<p>
<b>${products[i][0]} ${products[i][1]}</b>
— ₹${products[i][2]}
<button onclick="removeItem(${n})">❌</button>
</p>`;
total+=products[i][2];
});

document.getElementById("cartitems").innerHTML=
html||"<p>Cart खाली है</p>";

document.getElementById("cartbox").style.display="block";
}

function removeItem(n){
cart.splice(n,1);
updateCart();
openCart();
}

function closeCart(){
document.getElementById("cartbox").style.display="none";
}

function placeOrder(){
if(cart.length==0){
alert("Cart खाली है");
return;
}

let n=document.getElementById("customerName").value;
let m=document.getElementById("mobile").value;
let a=document.getElementById("address").value;

if(!n||!m||!a){
alert("कृपया नाम, मोबाइल और पता भरें");
return;
}
let orderText =
"🛒 *RadhaQuicks Order*\n\n" +
"👤 Customer: " + n +
"\n📱 Mobile: " + m +
"\n📍 Address: " + a +
"\n\n🛍️ *Items:*\n" +
cart.map(i => "• " + products[i][0] + " - ₹" + products[i][2]).join("\n") +
"\n\n💰 Total: ₹" + cart.reduce((sum,i) => sum + products[i][2], 0);

let adminNumber = "+917068014355";

window.open(
  "https://wa.me/" + adminNumber + "?text=" + encodeURIComponent(orderText),
  "_blank"
);
}

showProducts();
</script>

</body>
</html>
