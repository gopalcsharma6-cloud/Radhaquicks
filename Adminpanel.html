<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadhaQuicks Admin</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}
.header{
  background:#ff8a00;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header h1{margin:0;font-size:23px}
button{
  border:0;
  border-radius:8px;
  padding:10px 14px;
  cursor:pointer;
  font-weight:bold;
}
.logout{background:white;color:#ff7800}

.login{
  max-width:400px;
  margin:80px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px #ddd;
}
.login h2{text-align:center}
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}
.login button{
  width:100%;
  background:#ff8a00;
  color:white;
  margin-top:10px;
}

.dashboard{padding:18px;max-width:1100px;margin:auto}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}
.stat{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}
.stat b{
  display:block;
  font-size:26px;
  margin-top:5px;
}

.tabs{
  display:flex;
  gap:8px;
  overflow:auto;
  margin-bottom:15px;
}
.tab{
  background:white;
  border:1px solid #ddd;
  white-space:nowrap;
}
.tab.active{
  background:#ff8a00;
  color:white;
}

.order{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:14px;
  box-shadow:0 2px 8px #ddd;
}
.orderTop{
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.order h3{margin:0 0 8px}

.status{
  padding:5px 10px;
  border-radius:20px;
  background:#fff0df;
  color:#e66f00;
  font-size:13px;
}

.items{
  background:#f7f7f7;
  padding:10px;
  border-radius:8px;
  margin:12px 0;
}
.item{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.accept{background:#16a34a;color:white}
.next{background:#1769ff;color:white}
.delivered{background:#16a34a;color:white}

.empty{
  text-align:center;
  background:white;
  padding:40px;
  border-radius:12px;
  color:#777;
}

#error{
  color:red;
  text-align:center;
}

@media(max-width:700px){
  .stats{grid-template-columns:1fr}
  .orderTop{flex-direction:column}
}
</style>
</head>

<body>

<div id="loginPage" class="login">
  <h2>🔐 RadhaQuicks Admin</h2>

  <input id="email" type="email" placeholder="Admin Email">
  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <p id="error"></p>
</div>


<div id="adminPage" style="display:none">

  <div class="header">
    <h1>🛒 RadhaQuicks Admin</h1>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <div class="dashboard">

    <div class="stats">

      <div class="stat">
        New Orders
        <b id="newCount">0</b>
      </div>

      <div class="stat">
        Pending
        <b id="pendingCount">0</b>
      </div>

      <div class="stat">
        Today's Sales
        <b id="sales">₹0</b>
      </div>

    </div>


    <div class="tabs">

      <button class="tab active" onclick="setFilter('All',this)">
        All
      </button>

      <button class="tab" onclick="setFilter('New',this)">
        New
      </button>

      <button class="tab" onclick="setFilter('Accepted',this)">
        Accepted
      </button>

      <button class="tab" onclick="setFilter('Preparing',this)">
        Preparing
      </button>

      <button class="tab" onclick="setFilter('Out for Delivery',this)">
        Out for Delivery
      </button>

      <button class="tab" onclick="setFilter('Delivered',this)">
        Delivered
      </button>

    </div>


    <div id="orders"></div>

  </div>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBNMmah4gPJ4h4gL5P-vtuzwgCsjUzicO_0",
  authDomain: "radhaquicks.firebaseapp.com",
  projectId: "radhaquicks",
  storageBucket: "radhaquicks.firebasestorage.app",
  messagingSenderId: "728533037366",
  appId: "1:728533037366:web:8ec8b3ac1ef927f5a00397",
  measurementId: "G-0ZHMW4DS1T"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const ADMIN_UID = "2OjTRyo42FaXjzIZ5WWv4QALT0K3";

let allOrders = [];

let filter = "All";


window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const error =
    document.getElementById("error");

  error.textContent = "";

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(e){

    error.textContent =
      "Email ya password galat hai.";

  }

};


window.logout = async function(){

  await signOut(auth);

};


onAuthStateChanged(auth,(user)=>{

  if(user && user.uid === ADMIN_UID){

    document.getElementById("loginPage").style.display="none";

    document.getElementById("adminPage").style.display="block";

    loadOrders();

  }else{

    document.getElementById("loginPage").style.display="block";

    document.getElementById("adminPage").style.display="none";

  }

});


function loadOrders(){

  const q = query(
    collection(db,"orders"),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,(snapshot)=>{

    allOrders = [];

    snapshot.forEach((item)=>{

      allOrders.push({
        id:item.id,
        ...item.data()
      });

    });

    renderOrders();

  });

}


function renderOrders(){

  const box =
    document.getElementById("orders");

  let orders = allOrders;

  if(filter !== "All"){

    orders =
      allOrders.filter(
        o => o.status === filter
      );

  }

  document.getElementById("newCount").textContent =
    allOrders.filter(
      o => o.status === "New"
    ).length;

  document.getElementById("pendingCount").textContent =
    allOrders.filter(
      o => o.status !== "Delivered"
    ).length;

  const sales =
    allOrders
      .filter(o => o.status === "Delivered")
      .reduce(
        (sum,o)=>sum + Number(o.total || 0),
        0
      );

  document.getElementById("sales").textContent =
    "₹" + sales;


  if(orders.length === 0){

    box.innerHTML =
      '<div class="empty">Abhi koi order nahi hai.</div>';

    return;

  }


  box.innerHTML = orders.map(order => {

    const items =
      Array.isArray(order.items)
      ? order.items
      : [];


    const itemHTML =
      items.map(item=>{

        return `
          <div class="item">
            <span>
              ${escapeHTML(item.name || "")}
            </span>

            <b>
              ₹${Number(item.price || 0)}
            </b>
          </div>
        `;

      }).join("");


    return `

      <div class="order">

        <div class="orderTop">

          <div>

            <h3>
              Order #${order.id}
              <span class="status">
                ${escapeHTML(order.status || "New")}
              </span>
            </h3>

            <div>
              👤 <b>${escapeHTML(order.customerName || "")}</b>
            </div>

            <div>
              📞 ${escapeHTML(order.mobile || "")}
            </div>

            <div>
              📍 ${escapeHTML(order.address || "")}
            </div>

          </div>


          <div>
            <b>Total</b>

            <div style="font-size:25px;margin-top:5px">
              ₹${Number(order.total || 0)}
            </div>
          </div>

        </div>


        <div class="items">

          ${itemHTML}

        </div>


        <div class="actions">

          ${getNextButton(order)}

        </div>

      </div>

    `;

  }).join("");

}


function getNextButton(order){

  if(order.status === "New"){

    return `
      <button
        class="accept"
        onclick="changeStatus('${order.id}','Accepted')">
        ✓ Accept Order
      </button>
    `;

  }

  if(order.status === "Accepted"){

    return `
      <button
        class="next"
        onclick="changeStatus('${order.id}','Preparing')">
        👨‍🍳 Preparing
      </button>
    `;

  }

  if(order.status === "Preparing"){

    return `
      <button
        class="next"
        onclick="changeStatus('${order.id}','Out for Delivery')">
        🛵 Out for Delivery
      </button>
    `;

  }

  if(order.status === "Out for Delivery"){

    return `
      <button
        class="delivered"
        onclick="changeStatus('${order.id}','Delivered')">
        ✓ Delivered
      </button>
    `;

  }

  return `
    <span style="color:#16a34a;font-weight:bold">
      ✓ Order Delivered
    </span>
  `;

}


window.changeStatus = async function(id,status){

  try{

    await updateDoc(
      doc(db,"orders",id),
      {
        status:status
      }
    );

  }catch(error){

    alert(
      "Status update nahi hua."
    );

    console.error(error);

  }

};


window.setFilter = function(value,button){

  filter = value;

  document
    .querySelectorAll(".tab")
    .forEach(x =>
      x.classList.remove("active")
    );

  button.classList.add("active");

  renderOrders();

};


function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
