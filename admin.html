<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RadhaQuicks Admin</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}

header{
  background:#16833a;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

header h2{
  margin:0 0 5px;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.login{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:25px;
  border-radius:15px;
  box-shadow:0 3px 15px #ccc;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

button{
  border:0;
  border-radius:8px;
  padding:11px 15px;
  cursor:pointer;
  font-size:14px;
}

.login button{
  width:100%;
  background:#16833a;
  color:white;
  margin-top:10px;
}

.logout{
  background:white;
  color:#16833a;
  float:right;
}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin:15px 0;
}

.stat{
  background:white;
  padding:18px;
  border-radius:12px;
  box-shadow:0 2px 8px #ddd;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  padding:8px 0;
}

.tabs button{
  background:white;
  white-space:nowrap;
}

.tabs button.active{
  background:#16833a;
  color:white;
}

.order{
  background:white;
  margin:12px 0;
  padding:16px;
  border-radius:14px;
  box-shadow:0 2px 8px #ddd;
}

.order h3{
  margin:0 0 8px;
}

.items{
  background:#f5f5f5;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
}

.item{
  padding:5px 0;
  border-bottom:1px solid #ddd;
}

.total{
  font-size:20px;
  font-weight:bold;
  margin:10px 0;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#e8f5e9;
  color:#16833a;
  font-weight:bold;
  margin-bottom:10px;
}

.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.actions button{
  background:#16833a;
  color:white;
}

.empty{
  text-align:center;
  background:white;
  padding:30px;
  border-radius:12px;
  margin-top:20px;
}

.hidden{
  display:none;
}

.error{
  color:#d32f2f;
  margin-top:10px;
}

.small{
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="login">
  <h2>🔐 RadhaQuicks Admin</h2>
  <p>Admin account se login karein.</p>

  <input id="email" type="email" placeholder="Admin Email">

  <input id="password" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="loginError" class="error"></div>
</div>


<!-- ADMIN PANEL -->
<div id="adminScreen" class="hidden">

<header>
  <button class="logout" onclick="logout()">Logout</button>
  <h2>RadhaQuicks Admin</h2>
  <div>📦 Order Management</div>
</header>

<div class="container">

  <div class="stats">
    <div class="stat">
      New Orders
      <b id="newCount">0</b>
    </div>

    <div class="stat">
      Today's Sales
      <b id="todaySales">₹0</b>
    </div>
  </div>


  <div class="tabs">
    <button class="active" onclick="setFilter('All',this)">All</button>
    <button onclick="setFilter('New',this)">New</button>
    <button onclick="setFilter('Accepted',this)">Accepted</button>
    <button onclick="setFilter('Preparing',this)">Preparing</button>
    <button onclick="setFilter('Out for Delivery',this)">Out for Delivery</button>
    <button onclick="setFilter('Delivered',this)">Delivered</button>
  </div>


  <div id="orders"></div>

</div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  doc,
  updateDoc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyBNMmah4gPJh4gL5P-vtuzwgCsjUzicO_0",
  authDomain: "radhaquicks.firebaseapp.com",
  projectId: "radhaquicks",
  storageBucket: "radhaquicks.firebasestorage.app",
  messagingSenderId: "728533037366",
  appId: "1:728533037366:web:8ec8b3ac1ef927f5a00397",
  measurementId: "G-0ZHMW4DS1T"
};


/* START FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ADMIN UID */

const ADMIN_UID = "2OjTRyo42FaXjzIZ5WWv4QALT0K3";


let allOrders = [];
let currentFilter = "All";
let unsubscribeOrders = null;


/* LOGIN */

window.login = async function(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.innerText = "";

  if(!email || !password){

    errorBox.innerText =
      "Email aur password dono bhariye.";

    return;
  }

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    errorBox.innerText =
      "Login failed. Email/password check karein.";

  }

};


/* AUTH CHECK */

onAuthStateChanged(auth, user => {

  if(user){

    if(user.uid !== ADMIN_UID){

      alert("Is account ko Admin access nahi hai.");

      signOut(auth);

      return;
    }

    document
      .getElementById("loginScreen")
      .classList.add("hidden");

    document
      .getElementById("adminScreen")
      .classList.remove("hidden");

    loadOrders();

  }else{

    document
      .getElementById("loginScreen")
      .classList.remove("hidden");

    document
      .getElementById("adminScreen")
      .classList.add("hidden");

  }

});


/* LOGOUT */

window.logout = function(){

  signOut(auth);

};


/* LOAD REAL ORDERS */

function loadOrders(){

  if(unsubscribeOrders)
    unsubscribeOrders();

  const q = query(
    collection(db,"orders"),
    orderBy("createdAt","desc")
  );

  unsubscribeOrders = onSnapshot(
    q,
    snapshot => {

      allOrders = [];

      snapshot.forEach(item => {

        allOrders.push({
          id:item.id,
          ...item.data()
        });

      });

      renderOrders();

    },
    error => {

      console.error(error);

      document.getElementById("orders").innerHTML =
        `<div class="empty">
          Orders load nahi ho pa rahe.
          <br><br>
          ${error.message}
        </div>`;

    }
  );

}


/* FILTER */

window.setFilter = function(filter,button){

  currentFilter = filter;

  document
    .querySelectorAll(".tabs button")
    .forEach(b => b.classList.remove("active"));

  button.classList.add("active");

  renderOrders();

};


/* RENDER */

function renderOrders(){

  const box =
    document.getElementById("orders");

  let filtered = allOrders;

  if(currentFilter !== "All"){

    filtered =
      allOrders.filter(
        o => o.status === currentFilter
      );

  }

  let newOrders =
    allOrders.filter(
      o => o.status === "New"
    ).length;

  document.getElementById("newCount")
    .innerText = newOrders;


  let sales = 0;

  const today =
    new Date().toDateString();

  allOrders.forEach(o => {

    if(!o.createdAt) return;

    const date =
      o.createdAt.toDate();

    if(date.toDateString() === today){

      sales += Number(o.total || 0);

    }

  });

  document.getElementById("todaySales")
    .innerText = "₹" + sales;


  if(filtered.length === 0){

    box.innerHTML =
      `<div class="empty">
        📦 Is category mein koi order nahi hai.
      </div>`;

    return;
  }


  box.innerHTML =
    filtered.map(order => {

      let itemsHTML = "";

      if(Array.isArray(order.items)){

        itemsHTML =
          order.items.map(item => {

            return `
              <div class="item">
                ${item.name || "Item"}
                - ₹${item.price || 0}
              </div>
            `;

          }).join("");

      }


      let time = "";

      if(order.createdAt){

        time =
          order.createdAt.toDate()
          .toLocaleString("en-IN");

      }


      return `
        <div class="order">

          <h3>
            👤 ${escapeHTML(order.customerName || "Customer")}
          </h3>

          <div>
            📱 ${escapeHTML(order.mobile || "")}
          </div>

          <div>
            📍 ${escapeHTML(order.address || "")}
          </div>

          <div class="small">
            🕐 ${time}
          </div>

          <br>

          <span class="status">
            ${escapeHTML(order.status || "New")}
          </span>

          <div class="items">
            <b>🛒 Items</b>
            ${itemsHTML}
          </div>

          <div class="total">
            Total: ₹${order.total || 0}
          </div>

          <div class="actions">

            ${
              order.status === "New"
              ?
              `<button onclick="changeStatus('${order.id}','Accepted')">
                Accept
              </button>`
              : ""
            }

            ${
              order.status === "Accepted"
              ?
              `<button onclick="changeStatus('${order.id}','Preparing')">
                Preparing
              </button>`
              : ""
            }

            ${
              order.status === "Preparing"
              ?
              `<button onclick="changeStatus('${order.id}','Out for Delivery')">
                Out for Delivery
              </button>`
              : ""
            }

            ${
              order.status === "Out for Delivery"
              ?
              `<button onclick="changeStatus('${order.id}','Delivered')">
                Delivered
              </button>`
              : ""
            }

          </div>

        </div>
      `;

    }).join("");

}


/* CHANGE ORDER STATUS */

window.changeStatus = async function(orderId,newStatus){

  try{

    await updateDoc(
      doc(db,"orders",orderId),
      {
        status:newStatus
      }
    );

  }catch(error){

    console.error(error);

    alert(
      "Status update nahi hua: "
      + error.message
    );

  }

};


/* BASIC HTML SAFETY */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
